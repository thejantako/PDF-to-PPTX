<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF zu PowerPoint</title>
<style>
:root {
  --bg: #f3f5f4; --panel: #ffffff; --ink: #14201f; --muted: #5d6c6a;
  --line: #cfd8d6; --accent: #0b6e69; --accent-ink: #ffffff; --tile: #e4eae8; --err: #b3261e;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101716; --panel: #182120; --ink: #e8efee; --muted: #93a5a2;
    --line: #2d3b39; --accent: #3fb8af; --accent-ink: #06201e; --tile: #223130; --err: #f2b8b5;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font: 16px/1.5 "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  min-height: 100vh; display: flex; justify-content: center; padding: 32px 16px;
}
main { width: 100%; max-width: 640px; }
h1 { font-size: 2rem; line-height: 1.15; margin: 0 0 6px; letter-spacing: -0.02em; }
.sub { color: var(--muted); margin: 0 0 24px; }

#drop {
  display: block; position: relative; aspect-ratio: 16 / 9; width: 100%;
  background: var(--panel); border: 2px dashed var(--line); border-radius: 6px;
  cursor: pointer; text-align: center; padding: 16px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
}
#drop:hover, #drop.over, #drop:focus-visible { border-color: var(--accent); outline: none; }
#drop.over { background: var(--tile); }
#drop strong { font-size: 1.15rem; }
#drop span { color: var(--muted); font-size: .95rem; overflow-wrap: anywhere; }
#drop.has-file { border-style: solid; border-color: var(--accent); }
input[type=file] { display: none; }

.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 20px; margin: 22px 0; }
.opts label { display: block; font-weight: 600; font-size: .95rem; margin-bottom: 6px; }
.opts output { font-weight: 400; color: var(--muted); }
.hint { color: var(--muted); font-size: .85rem; margin-top: 4px; }
input[type=range] { width: 100%; accent-color: var(--accent); }
select {
  width: 100%; padding: 8px 10px; font: inherit; color: var(--ink);
  background: var(--panel); border: 1px solid var(--line); border-radius: 4px;
}
@media (max-width: 480px) { .opts { grid-template-columns: 1fr; } }

button {
  font: inherit; font-weight: 600; width: 100%; padding: 14px; cursor: pointer;
  background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 4px;
}
button:disabled { opacity: .45; cursor: not-allowed; }
button:focus-visible, select:focus-visible, input[type=range]:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

#progress { margin-top: 22px; display: none; }
#bar { height: 6px; background: var(--tile); border-radius: 3px; overflow: hidden; }
#bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .15s; }
#status { margin: 8px 0 12px; font-size: .95rem; }
#status.err { color: var(--err); font-weight: 600; }
#film { display: flex; flex-wrap: wrap; gap: 6px; max-height: 220px; overflow-y: auto; }
#film .t {
  width: 56px; background: var(--tile); border: 1px solid var(--line);
  display: flex; align-items: center; justify-content: center;
  font-size: .7rem; color: var(--muted);
}
#film canvas { display: block; width: 100%; height: auto; }

footer { margin-top: 28px; color: var(--muted); font-size: .85rem; }
footer a { color: inherit; }
</style>
</head>
<body>
<main>
  <h1>PDF zu PowerPoint</h1>
  <p class="sub">Jede PDF-Seite wird eine Folie. Die Umwandlung läuft komplett in deinem Browser, nichts wird hochgeladen.</p>

  <label id="drop" tabindex="0" for="file">
    <strong id="dropTitle">PDF hierher ziehen</strong>
    <span id="dropSub">oder klicken, um eine Datei zu wählen</span>
  </label>
  <input type="file" id="file" accept="application/pdf,.pdf">

  <div class="opts">
    <div>
      <label for="dpi">Auflösung: <output id="dpiOut">150 DPI</output></label>
      <input type="range" id="dpi" min="72" max="300" step="6" value="150">
      <div class="hint">Höher = schärfer, aber größere Datei.</div>
    </div>
    <div>
      <label for="fmt">Bildformat</label>
      <select id="fmt">
        <option value="jpeg">JPEG (kleine Datei)</option>
        <option value="png">PNG (verlustfrei)</option>
      </select>
    </div>
  </div>

  <button id="go" disabled>Als PowerPoint speichern</button>

  <div id="progress">
    <div id="bar"><i></i></div>
    <div id="status" role="status" aria-live="polite"></div>
    <div id="film"></div>
  </div>

  <footer>Die Folien bestehen aus Bildern der PDF-Seiten, Text darin ist nicht bearbeitbar.</footer>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
<script>
if (typeof PptxGenJS === "undefined") {
  document.write('<script src="https://cdn.jsdelivr.net/gh/gitbrent/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"><\/script>');
}
</script>
<script>
const $ = id => document.getElementById(id);
pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const MAX_PIXELS = 24e6; // Schutz vor zu großen Canvas-Flächen
let pdfFile = null;

const drop = $("drop"), fileInput = $("file"), go = $("go");

function setFile(f) {
  if (!f || (f.type !== "application/pdf" && !/\.pdf$/i.test(f.name))) {
    setStatus("Das ist keine PDF-Datei. Bitte wähle eine Datei mit der Endung .pdf.", true);
    $("progress").style.display = "block";
    return;
  }
  pdfFile = f;
  drop.classList.add("has-file");
  $("dropTitle").textContent = f.name;
  $("dropSub").textContent = (f.size / 1048576).toFixed(1) + " MB · anderes PDF wählen";
  go.disabled = false;
  $("progress").style.display = "none";
}

fileInput.addEventListener("change", () => setFile(fileInput.files[0]));
drop.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); fileInput.click(); } });
["dragenter", "dragover"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", e => setFile(e.dataTransfer.files[0]));

$("dpi").addEventListener("input", e => $("dpiOut").textContent = e.target.value + " DPI");

function setStatus(msg, isErr = false) {
  const s = $("status");
  s.textContent = msg;
  s.className = isErr ? "err" : "";
}
const tick = () => new Promise(r => setTimeout(r));

go.addEventListener("click", async () => {
  if (!pdfFile) return;
  const dpi = +$("dpi").value, fmt = $("fmt").value;
  go.disabled = true;
  $("progress").style.display = "block";
  $("film").innerHTML = "";
  $("bar").firstElementChild.style.width = "0";
  setStatus("PDF wird gelesen …");

  try {
    const data = await pdfFile.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data }).promise;
    const n = pdf.numPages;

    // Foliengröße = Größe der ersten Seite (in Zoll)
    const first = await pdf.getPage(1);
    const v1 = first.getViewport({ scale: 1 });
    const slideW = v1.width / 72, slideH = v1.height / 72;

    const pptx = new PptxGenJS();
    pptx.defineLayout({ name: "PDF", width: slideW, height: slideH });
    pptx.layout = "PDF";

    // Platzhalter-Kacheln für den Fortschritt
    const tiles = [];
    for (let i = 1; i <= n; i++) {
      const t = document.createElement("div");
      t.className = "t";
      t.style.aspectRatio = v1.width + " / " + v1.height;
      t.textContent = i;
      $("film").appendChild(t);
      tiles.push(t);
    }

    for (let i = 1; i <= n; i++) {
      setStatus(`Seite ${i} von ${n} wird umgewandelt …`);
      const page = i === 1 ? first : await pdf.getPage(i);
      let scale = dpi / 72;
      const base = page.getViewport({ scale: 1 });
      const px = base.width * base.height * scale * scale;
      if (px > MAX_PIXELS) scale *= Math.sqrt(MAX_PIXELS / px);
      const vp = page.getViewport({ scale });

      const canvas = document.createElement("canvas");
      canvas.width = Math.round(vp.width);
      canvas.height = Math.round(vp.height);
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#fff";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      await page.render({ canvasContext: ctx, viewport: vp }).promise;

      const mime = fmt === "png" ? "image/png" : "image/jpeg";
      const dataUrl = canvas.toDataURL(mime, 0.88);

      // Bild einpassen und zentrieren (falls Seiten unterschiedlich groß sind)
      const pw = base.width / 72, ph = base.height / 72;
      const f = Math.min(slideW / pw, slideH / ph);
      const w = pw * f, h = ph * f;
      pptx.addSlide().addImage({
        data: dataUrl.replace(/^data:/, ""),
        x: (slideW - w) / 2, y: (slideH - h) / 2, w, h
      });

      // Vorschau-Kachel füllen
      const th = document.createElement("canvas");
      th.width = 112; th.height = Math.round(112 * canvas.height / canvas.width);
      th.getContext("2d").drawImage(canvas, 0, 0, th.width, th.height);
      tiles[i - 1].textContent = "";
      tiles[i - 1].appendChild(th);

      canvas.width = canvas.height = 0;
      page.cleanup();
      $("bar").firstElementChild.style.width = (i / n * 100) + "%";
      await tick();
    }

    setStatus("Datei wird erstellt …");
    await tick();
    const name = pdfFile.name.replace(/\.pdf$/i, "") + ".pptx";
    await pptx.writeFile({ fileName: name });
    setStatus(`Fertig: ${name} mit ${n} Folien wurde heruntergeladen.`);
  } catch (err) {
    console.error(err);
    const pw = err && err.name === "PasswordException";
    setStatus(pw
      ? "Die PDF ist passwortgeschützt. Entferne den Schutz und versuche es noch einmal."
      : "Die Umwandlung hat nicht geklappt: " + (err.message || err) +
        ". Probiere eine niedrigere Auflösung oder eine kleinere Datei.", true);
  } finally {
    go.disabled = false;
  }
});
</script>
</body>
</html>
